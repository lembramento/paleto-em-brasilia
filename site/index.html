<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paletó em Brasília</title>
<meta name="description" content="Paletó em Brasília — uma banda. três singles. setembro, outubro, novembro.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div style="position:relative; background:#000">

  <!-- HERO -->
  <div class="hero">
    <img class="hero-bg" src="img/noir-7.jpeg" alt="">
    <div class="hero-gradient"></div>

    <div class="hero-content">
      <div class="topbar">
        <a class="brand" href="/" aria-label="Paletó em Brasília">
          <svg class="brand-mark" viewBox="0 0 573 1257" fill="currentColor" style="fill-rule:evenodd;clip-rule:evenodd" aria-hidden="true" focusable="false">
            <defs>
              <mask id="pb-counters" maskUnits="userSpaceOnUse" x="0" y="0" width="573" height="1257">
                <rect x="0" y="0" width="573" height="1257" fill="#fff"/>
                <g transform="matrix(1,0,0,1,-1359.942178,-1638.78301)">
                  <g transform="matrix(1,0,0,0.920399,-318.648843,557.659139)">
                    <g transform="matrix(2.670898,0,0,2.670898,936.076502,551.204191)">
                      <path d="M315.483,379.064C304.769,379.088 298.079,379.75 297.893,377.444C297.761,375.801 297.842,267.096 297.849,257.5C297.853,252.093 300.063,253.205 305.501,253.213C312.468,253.223 345.139,250.5 366.164,281.735C390.936,318.535 370.549,371.853 319.534,378.735C318.191,378.917 316.825,378.883 315.483,379.064Z" fill="#000"/>
                    </g>
                  </g>
                  <g transform="matrix(1,0,0,0.926668,330.749331,-31.972939)">
                    <g transform="matrix(-2.540115,0,0,2.670898,1781.532775,1137.6924)">
                      <path d="M255.402,735.955C199.054,722.138 185.427,664.44 212.008,628.118C235.253,596.354 270.944,599.591 276.455,599.783C277.703,599.826 278.017,601.355 278.055,601.541C278.07,601.612 278.082,732.948 277.977,735.579C277.792,740.206 257.177,736.292 255.402,735.955Z" fill="#000"/>
                    </g>
                  </g>
                </g>
              </mask>
            </defs>
            <g mask="url(#pb-counters)">
              <g transform="matrix(1,0,0,1,-1359.942178,-1638.78301)">
                <g transform="matrix(1,0,0,0.920399,-318.648843,557.659139)">
                  <path d="M1678.715,1689.694C1678.77,1525.919 1678.232,1180.269 1679.63,1177.342C1681.048,1174.372 1796.124,1172.359 1821.681,1179.469C1831.416,1182.177 1911.464,1196.441 1964.685,1282.314C2041.574,1406.375 1969.386,1580.551 1818.64,1612.09C1773.498,1621.535 1734.115,1611.115 1731.618,1621.01C1731.563,1621.228 1731.545,1654.656 1731.55,1689.694L1678.715,1689.694Z"/>
                </g>
                <g transform="matrix(1,0,0,0.926668,330.749331,-31.972939)">
                  <g transform="matrix(-0.951034,0,0,0.99989,2679.870947,586.770785)">
                    <path d="M1735.597,2028.415C1735.755,2186.984 1735.597,2570.401 1735.597,2570.401C1735.597,2570.401 1632.799,2576.719 1597.022,2566.75C1324.43,2490.794 1363.754,2100.872 1663.897,2099.864C1666.675,2099.855 1678.387,2102.277 1678.549,2093.765C1678.986,2070.902 1679.228,2047.667 1679.262,2028.336C1695.365,2028.191 1717.063,2028.436 1735.597,2028.415Z"/>
                  </g>
                </g>
                <g transform="matrix(1.409154,0,0,1,149.063765,293.846002)">
                  <rect x="859.342" y="1753.937" width="41.129" height="457.063"/>
                </g>
                <g transform="matrix(1.033011,0,0,1,-18.027622,-222.513986)">
                  <path d="M1887.901,2372.483L1887.901,2414.517C1887.901,2419.199 1884.222,2423 1879.689,2423L1342.212,2423C1337.68,2423 1334,2419.199 1334,2414.517L1334,2372.483C1334,2367.801 1337.68,2364 1342.212,2364L1879.689,2364C1884.222,2364 1887.901,2367.801 1887.901,2372.483Z"/>
                </g>
                <g transform="matrix(1.033011,0,0,1,-18.027622,-88.654303)">
                  <path d="M1887.901,2372.483L1887.901,2414.517C1887.901,2419.199 1884.222,2423 1879.689,2423L1342.212,2423C1337.68,2423 1334,2419.199 1334,2414.517L1334,2372.483C1334,2367.801 1337.68,2364 1342.212,2364L1879.689,2364C1884.222,2364 1887.901,2367.801 1887.901,2372.483Z"/>
                </g>
              </g>
            </g>
          </svg>
        </a>
        <div class="lang-switch">
          <button class="lang-btn" data-lang-btn="pt" type="button">PT</button>
          <span style="color:rgba(255,255,255,.3)">·</span>
          <button class="lang-btn" data-lang-btn="en" type="button">EN</button>
        </div>
      </div>

      <div class="hero-bottom">
        <div class="hero-kicker" data-pt="UMA BANDA. TRÊS SINGLES. SETEMBRO, OUTUBRO, NOVEMBRO." data-en="One band. Three singles. September, October, November."></div>
        <h1 class="hero-title">Paletó em Brasília</h1>
        <div class="hero-scroll">
          <span data-pt="ROLE A PÁGINA.&nbsp;" data-en="Scroll.&nbsp;"></span>
          <span class="hero-scroll-line"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- FALA DO ARTICULISTA -->
  <div class="statement">
    <div class="statement-inner">
      <p class="statement-quote" data-pt="&ldquo;Confirmo que existe um material.&rdquo;" data-en="&ldquo;I confirm that a material exists.&rdquo;"></p>
      <div class="statement-meta">
        <span class="statement-line"></span>
        <span data-pt="Pronunciamento nº 2 — o Articulista" data-en="Statement no. 2 — the Articulator"></span>
      </div>
    </div>
  </div>

  <!-- SINGLE -->
  <div class="single">
    <img class="single-cover" src="img/capa-do-meio-ao-fim.jpg" alt="Capa do single">
    <div class="single-info">
      <div class="single-kicker" data-pt="Single 01" data-en="Single 01"></div>
      <h2 class="single-title">Do meio ao fim</h2>
      <div class="single-facts">
        <span class="fact-label" data-pt="Lançamento" data-en="Release"></span>
        <span class="fact-value">11.09.2026</span>
        <span class="fact-label" data-pt="Formato" data-en="Format"></span>
        <span class="fact-value" data-pt="Single digital" data-en="Digital single"></span>
        <span class="fact-label last" data-pt="A seguir" data-en="Next"></span>
        <span class="fact-value last" data-pt="Dois singles até novembro" data-en="Two more singles until November"></span>
      </div>
      <button class="btn-solid" type="button" data-open-intimacao>
        <span data-pt="Receba a intimação." data-en="Receive the summons."></span>
      </button>
    </div>
  </div>

  <!-- ARQUIVO -->
  <div class="archive" data-section="arquivo">
    <div class="archive-header">
      <h3 class="archive-title" data-pt="Pronunciamentos" data-en="Statements"></h3>
      <a class="archive-tag archive-channel" data-youtube-channel target="_blank" rel="noopener" data-pt="Arquivo público" data-en="Public archive"></a>
    </div>

    <div class="archive-list" data-archive-list></div>

    <p class="archive-disclaimer" data-pt="Cuidado. Conteúdo gerado por inteligência artificial." data-en="Caution. Content generated by artificial intelligence."></p>
  </div>

  <!-- AZUL: A BANDA + E-MAIL -->
  <div class="band">
    <div class="band-photo-wrap">
      <img class="band-photo" src="img/banda.png" alt="Paletó em Brasília">
      <div class="band-photo-overlay"></div>
    </div>
    <div class="band-content">
      <div class="band-kicker" data-pt="A banda" data-en="The band"></div>
      <h3 class="band-title" data-pt="Assine embaixo." data-en="Sign below."></h3>
      <p class="band-desc" data-pt="Seu nome fica nos autos. Você é notificado quando tiver música." data-en="Your name goes on the record. You are notified when there is music — nothing else."></p>
      <form class="signup-form" data-signup-form novalidate>
        <div class="email-row">
          <input class="email-input" type="email" required placeholder="seu@email.com" autocomplete="email">
          <button class="email-submit" type="submit">
            <span data-pt="Assinar" data-en="Sign"></span>
          </button>
        </div>
        <div class="form-msg" data-signup-msg></div>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span class="footer-copy">Paletó em Brasília — 2026</span>
    <a class="footer-press" data-press-link data-pt="imprensa" data-en="press"></a>
    <div class="footer-links">
      <a data-instagram-link>Instagram</a>
      <a data-presave-link>Spotify</a>
    </div>
  </div>

  <!-- FLUXO: RECEBA A INTIMAÇÃO -->
  <div class="modal-overlay" data-modal-overlay hidden>
    <div class="modal-box" data-modal-box>
      <button class="modal-close" type="button" data-close-intimacao>✕</button>

      <!-- ETAPA 1: E-MAIL -->
      <div class="modal-step" data-step="email">
        <div class="modal-kicker" data-pt="Intimação nº 001/2026 — etapa 1 de 2" data-en="Summons no. 001/2026 — step 1 of 2"></div>
        <h4 class="modal-title" data-pt="Primeiro, o seu e-mail." data-en="First, your e-mail."></h4>
        <p class="modal-body-text" data-pt="Não custa nada." data-en="Two steps. This one is painless."></p>
        <form class="modal-form" data-intimacao-email-form novalidate>
          <div class="email-row">
            <input class="email-input" type="email" required placeholder="seu@email.com" autocomplete="email">
            <button class="email-submit" type="submit">
              <span data-pt="Prosseguir" data-en="Proceed"></span>
            </button>
          </div>
        </form>
      </div>

      <!-- ETAPA 2: PRÉ-SAVE (NOIR / ARTICULISTA) -->
      <div class="modal-step-presave" data-step="presave" hidden>
        <div class="presave-photo-wrap">
          <img class="presave-photo" src="img/articulista-gabinete.jpg" alt="O Articulista">
          <div class="presave-photo-overlay"></div>
        </div>
        <div class="presave-content">
          <h4 class="presave-title" data-pt="Perfeito. Só mais uma coisa..." data-en="An understanding has been reached."></h4>
          <p class="presave-text" data-pt="&nbsp;Um segundo gesto bondoso é requerido da sua parte. Chamam de &quot;pré-save&quot;. Eu chamo de &lt;i&gt;sentar-se à mesa&lt;/i&gt;." data-en="My friends. It came to my attention that your e-mail was recorded, and I want you to know this was noted with great sensibility, at the highest level. Now a second gesture is required of you — small, almost nothing, twenty seconds, no more. They call it &ldquo;pre-save.&rdquo; I call it the sitting of the table."></p>
          <p class="presave-text" data-pt="Funciona assim: você autoriza, no seu próprio streaming, um aplicativo que jamais ouviu falar antes. Isso não foi articulação minha. Mas posso lhe dizer, com a autoridade moral que o momento exige, que é para o bem do processo geral." data-en="It works like this: you authorise, on your own streaming service, an application you have never heard of before. This was not my design. But I can tell you, with the moral authority the moment demands, that it is for the good of the process."></p>
          <div class="presave-actions">
            <a class="btn-presave" data-presave-cta target="_blank" rel="noopener">
              <span data-pt="Sentar à mesa" data-en="Sit at the table"></span>
            </a>
            <button class="btn-text" type="button" data-close-intimacao>
              <span data-pt="Retirar a tratativa" data-en="Withdraw the negotiation"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- ETAPA 3: FIM -->
      <div class="modal-step-fim" data-step="fim" hidden>
        <div class="modal-kicker" data-pt="Processo encerrado" data-en="Case closed"></div>
        <h4 class="modal-title" data-pt="Intimação cumprida." data-en="Summons complied with."></h4>
        <p class="modal-body-text" style="max-width:44ch" data-pt="Seu nome está nos autos. Nada mais será exigido de você até 11.09.2026." data-en="Your name is on the record. Nothing else will be asked of you until 11.09.2026."></p>
        <button class="btn-solid-alt" type="button" data-close-intimacao>
          <span data-pt="Encerrar" data-en="Close"></span>
        </button>
      </div>
    </div>
  </div>

</div>

<!-- iframe oculto: destino do POST ao MailerLite, mantém o usuário na página -->
<iframe name="ml-target" style="display:none" title="" aria-hidden="true"></iframe>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
